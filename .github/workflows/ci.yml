name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  test:
    name: Build, test and conformance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # One runner per platform the manifest declares: osx-arm64 and win-x64.
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # The CLI version is pinned in .config/dotnet-tools.json, equal to MacroDeckSdkVersion.
      - name: Restore the plugin CLI
        run: dotnet tool restore

      - name: Build
        run: dotnet build MuteDeckPlugin.slnx -c Release -warnaserror

      - name: Test
        run: dotnet test MuteDeckPlugin.slnx -c Release --no-build

      - name: Conformance
        run: >
          dotnet tool run macrodeck-plugin -- test --project src/MuteDeckPlugin
          --report markdown --output conformance-${{ matrix.os }}.md --timeout 60 --no-color

      - name: Upload the conformance report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-${{ matrix.os }}
          path: conformance-${{ matrix.os }}.md
          retention-days: 14
          if-no-files-found: error

  package:
    name: Pack and validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore the plugin CLI
        run: dotnet tool restore

      # A framework-dependent .NET plugin cross-builds every declared platform on one Linux runner.
      - name: Build the package
        run: dotnet tool run macrodeck-plugin -- build --source src/MuteDeckPlugin --output artifacts --force --no-color

      - name: Validate for publication
        run: |
          set -euo pipefail
          artifact="$(ls artifacts/*.macroDeckPlugin)"
          dotnet tool run macrodeck-plugin -- validate --artifact "$artifact" --level publication --no-color

      - name: Inspect
        run: |
          set -euo pipefail
          artifact="$(ls artifacts/*.macroDeckPlugin)"
          # Warnings go to stderr, so both streams are checked.
          dotnet tool run macrodeck-plugin -- inspect --artifact "$artifact" --no-color 2>&1 | tee inspect.txt
          if grep -q 'bundled-icon-pack-not-in-files' inspect.txt; then
            echo "::error::The bundled icon pack is not listed in the package's files."
            exit 1
          fi
